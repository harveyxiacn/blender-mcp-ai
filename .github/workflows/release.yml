      #   if: success()
      #   continue-on-error: true
      #   env:
      #     DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
      #   run: python scripts/discord_changelog.py
