name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build Python package
        run: uv build

      - name: Build addon zip
        run: python build_addon.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

      # Discord announcement is disabled: the community invite was retired, so
      # there is nowhere to post. scripts/discord_changelog.py is kept, and the
      # DISCORD_CHANGELOG_WEBHOOK secret is still set, so restoring this step is
      # all that is needed to bring the announcement back.
